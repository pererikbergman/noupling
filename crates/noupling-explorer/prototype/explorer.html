<!doctype html>
<!--
  PROTOTYPE — noupling Explorer interactive HTML
  Question being answered: what should the Explorer's main view look like?

  Three radically different layouts of the same sample data, switchable via
  `?variant=A|B|C` and the floating switcher at the bottom. Light/dark theme
  toggle inside each variant.

  Throwaway. The winning variant seeds #232 (template subproject bootstrap);
  the rest gets deleted along with this file.

  Open with: open crates/noupling-explorer/prototype/explorer.html
  (or drag into a browser tab)
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>noupling Explorer — prototype</title>
  <style>
    /* === Design tokens (from docs/noupling-explorer-design.md) === */
    :root[data-theme="dark"] {
      --bg: #0B0B0C;
      --card: #18181C;
      --card-header: #18181C;
      --border: #2A2A2E;
      --text: #FFFFFF;
      --text-muted: #8E8E93;
      --pill-active-bg: #2A2A2E;
      --pill-active-text: #FFFFFF;
      --action-bg: #FFFFFF;
      --action-text: #0B0B0C;
      --success: #30D158;
      --edge: rgba(142, 142, 147, 0.45);
      --edge-cycle: #FF453A;
      --edge-violation: #FF453A;
      --accent-ui: #A78BFA;
      --accent-domain: #14B8A6;
      --accent-infra: #F97316;
      --layer-band-clean: rgba(20, 184, 166, 0.07);
      --layer-band-warm: rgba(255, 69, 58, 0.10);
    }
    :root[data-theme="light"] {
      --bg: #F5F5F7;
      --card: #FFFFFF;
      --card-header: #F0F0F2;
      --border: #E5E5EA;
      --text: #1C1C1E;
      --text-muted: #636366;
      --pill-active-bg: #1C1C1E;
      --pill-active-text: #FFFFFF;
      --action-bg: #1C1C1E;
      --action-text: #FFFFFF;
      --success: #34C759;
      --edge: rgba(99, 99, 102, 0.55);
      --edge-cycle: #FF3B30;
      --edge-violation: #FF3B30;
      --accent-ui: #7C3AED;
      --accent-domain: #0D9488;
      --accent-infra: #EA580C;
      --layer-band-clean: rgba(13, 148, 136, 0.06);
      --layer-band-warm: rgba(255, 59, 48, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* === Common chrome === */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .card-inner { padding: 16px 20px; }
    .card-header {
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 10px;
    }
    .stat { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    .stat-value { font-size: 22px; font-weight: 600; }
    .stat-value-lg { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; }
    .badge-success {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--success); color: #fff;
      padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .badge-success::before { content: ""; width: 6px; height: 6px; background: #fff; border-radius: 50%; }
    .pill {
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted);
      cursor: pointer; user-select: none; background: transparent;
    }
    .pill.active { background: var(--pill-active-bg); color: var(--pill-active-text); border-color: var(--pill-active-bg); }
    .btn-primary {
      background: var(--action-bg); color: var(--action-text);
      border: none; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px;
      font-size: 13px; cursor: pointer;
    }
    .input {
      background: transparent; color: var(--text);
      border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px;
      font-size: 13px; outline: none; min-width: 0;
    }
    .input:focus { border-color: var(--text-muted); }
    .crumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .crumb a { color: var(--text-muted); text-decoration: none; }
    .crumb a:hover { color: var(--text); }
    .crumb .sep::before { content: "/"; opacity: 0.45; }
    .crumb .current { color: var(--text); font-weight: 500; }

    /* === Logo + theme toggle === */
    .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 16px; }
    .logo::before { content: "◉"; color: var(--accent-domain); margin-right: 6px; }
    .theme-toggle {
      background: transparent; border: 1px solid var(--border);
      width: 32px; height: 32px; border-radius: 999px;
      cursor: pointer; color: var(--text-muted); font-size: 14px;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* === LSM canvas (shared) === */
    .lsm-frame {
      position: relative; background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; min-height: 0;
    }
    .lsm-svg { display: block; width: 100%; height: 100%; }
    .lsm-band-label {
      position: absolute; left: 12px;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
      pointer-events: none;
    }
    .node-rect { rx: 12; ry: 12; }

    /* === Switcher === */
    .switcher {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px;
      z-index: 999;
      font-size: 13px;
    }
    .switcher button {
      background: transparent; color: var(--text);
      border: none; cursor: pointer;
      width: 32px; height: 32px; border-radius: 999px;
      font-size: 16px;
    }
    .switcher button:hover { background: var(--pill-active-bg); color: var(--pill-active-text); }
    .switcher .label { padding: 0 12px; font-weight: 500; }
    .switcher .label small { color: var(--text-muted); margin-left: 8px; font-weight: 400; }

    /* === Variant A: Canvas-first minimal === */
    .va-root { display: flex; flex-direction: column; height: 100vh; }
    .va-topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .va-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; }
    .va-canvas { flex: 1; padding: 0 20px 20px; min-height: 0; }
    .va-details {
      position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
      background: var(--card); border-left: 1px solid var(--border);
      padding: 20px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.18s ease;
    }
    .va-details.open { transform: translateX(0); }

    /* === Variant B: Three-pane workspace === */
    .vb-root { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    .vb-header { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--card); gap: 24px; }
    .vb-stats { display: flex; gap: 24px; flex: 1; }
    .vb-main { display: grid; grid-template-columns: 240px 1fr 320px; gap: 16px; padding: 16px; min-height: 0; }
    .vb-side { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; overflow-y: auto; }
    .vb-side h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .vb-tree-item { padding: 6px 8px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .vb-tree-item:hover { background: var(--pill-active-bg); color: var(--pill-active-text); }
    .vb-tree-item .count { font-size: 11px; color: var(--text-muted); }
    .vb-canvas-wrap { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; }

    /* === Variant C: Sidebar tree navigation === */
    .vc-root { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
    .vc-rail {
      grid-row: span 2;
      background: var(--card); border-right: 1px solid var(--border);
      padding: 20px 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px;
    }
    .vc-rail .logo-row { display: flex; align-items: center; justify-content: space-between; }
    .vc-rail .search { width: 100%; }
    .vc-rail .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .vc-rail-section { display: flex; flex-direction: column; gap: 6px; }
    .vc-rail-section h3 { margin: 0 0 4px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .vc-main { padding: 24px; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
    .vc-statusbar {
      display: flex; align-items: center; gap: 18px;
      padding: 8px 20px;
      background: var(--card); border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted);
      grid-column: 2;
    }
    .vc-statusbar strong { color: var(--text); font-weight: 600; }

    /* === Variant D: Canvas-dominant + tabbed right panel (understand-anything inspired) === */
    .vd-root { display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto auto 1fr; height: 100vh; }
    .vd-topbar {
      grid-column: span 2;
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: var(--card); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .vd-topbar .group {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }
    .vd-topbar .group button {
      background: transparent; color: var(--text-muted);
      border: none; padding: 5px 10px; border-radius: 7px;
      font-size: 12px; cursor: pointer; white-space: nowrap;
    }
    .vd-topbar .group button:hover { color: var(--text); }
    .vd-topbar .group button.active {
      background: var(--card); color: var(--text);
      box-shadow: 0 1px 0 var(--border);
    }
    .vd-topbar .icon-btn {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 8px;
      width: 32px; height: 32px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .vd-topbar .icon-btn:hover { color: var(--text); }
    .vd-topbar .icon-btn.danger:hover { color: var(--edge-violation); border-color: var(--edge-violation); }
    .vd-topbar .kbd { font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
    .vd-searchrow {
      grid-column: span 2;
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .vd-searchrow .search-wrap {
      flex: 1; display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 4px 8px 4px 12px;
    }
    .vd-searchrow .search-wrap input {
      background: transparent; border: none; color: var(--text);
      flex: 1; outline: none; font-size: 13px; min-width: 0; padding: 6px 0;
    }
    .vd-searchrow .search-wrap .modes { display: flex; gap: 2px; }
    .vd-searchrow .search-wrap .modes button {
      background: transparent; color: var(--text-muted);
      border: none; padding: 4px 10px; border-radius: 6px;
      font-size: 11px; cursor: pointer;
    }
    .vd-searchrow .search-wrap .modes button.active {
      background: var(--pill-active-bg); color: var(--pill-active-text);
    }
    .vd-overview-chip {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px;
    }
    .vd-canvas-area {
      position: relative; overflow: hidden;
      background: var(--bg);
    }
    .vd-canvas-area > .lsm-frame { border: none; border-radius: 0; height: 100%; }
    .vd-zoomctrl {
      position: absolute; left: 12px; bottom: 12px;
      display: flex; flex-direction: column; gap: 2px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 3px;
    }
    .vd-zoomctrl button {
      background: transparent; color: var(--text); border: none;
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .vd-zoomctrl button:hover { background: var(--pill-active-bg); color: var(--pill-active-text); }
    .vd-canvas-pillrow {
      position: absolute; top: 12px; left: 16px;
      display: flex; gap: 6px; flex-wrap: wrap;
      z-index: 5;
    }
    .vd-zoomctrl, .vd-actionplan-strip { z-index: 5; }
    .vd-canvas-pillrow .pill { font-size: 11px; padding: 4px 10px; }
    .vd-rightpanel {
      grid-row: span 1;
      background: var(--card); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .vd-tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .vd-tabs button {
      flex: 1; background: transparent; border: none;
      color: var(--text-muted); padding: 12px 8px;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; font-weight: 600;
    }
    .vd-tabs button.active {
      color: var(--text);
      border-bottom: 2px solid var(--text);
    }
    .vd-tabbody { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .vd-tabbody h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .vd-step-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px;
    }
    .vd-step-card h4 { margin: 0 0 6px; font-size: 14px; }
    .vd-step-card p { margin: 0; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
    .vd-step-card .btn-primary { margin-top: 12px; width: 100%; padding: 9px; }
    .vd-step-list { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: step; }
    .vd-step-list li {
      padding: 8px 6px; border-radius: 6px;
      font-size: 13px; color: var(--text-muted);
      cursor: pointer; counter-increment: step;
      display: flex; gap: 10px; align-items: baseline;
    }
    .vd-step-list li::before {
      content: counter(step, decimal-leading-zero);
      font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted);
      letter-spacing: 0.06em; flex-shrink: 0;
    }
    .vd-step-list li:hover { background: var(--bg); color: var(--text); }
    .vd-step-list li.current { color: var(--text); background: var(--bg); }
    .vd-actionplan-strip {
      position: absolute; right: 16px; bottom: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--text-muted);
    }
    .vd-actionplan-strip strong { color: var(--text); }

    /* small helpers */
    .row { display: flex; align-items: center; gap: 12px; }
    .col { display: flex; flex-direction: column; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--text-muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }
    .gap-sm { gap: 6px; } .gap-md { gap: 12px; } .gap-lg { gap: 20px; }

    /* node card (used inside details panes too) */
    .node-card { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); align-items: center; }
    .node-stripe { width: 4px; align-self: stretch; border-radius: 4px; }
    .node-card .node-title { font-weight: 600; font-size: 13px; }
    .node-card .node-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

<!-- ROOT: rendered by JS into one of three variants -->
<div id="root"></div>

<!-- Floating switcher -->
<div class="switcher" id="switcher" aria-label="Variant switcher (prototype only)">
  <button id="prevBtn" title="Previous variant (←)">‹</button>
  <span class="label" id="switcherLabel">A <small>—</small></span>
  <button id="nextBtn" title="Next variant (→)">›</button>
</div>

<script>
  // === Sample data: a small fictional codebase, hand-shaped to show
  // each design's behavior (a violation, a cycle, mixed layer health) ===
  const data = {
    noupling_version: "0.7.0",
    generated_at: "Jun 4, 2026 · 14:55 UTC",
    codebase: {
      path: "~/code/acme-payments",
      title: "acme-payments",
      languages: [
        { name: "rust", file_count: 142, loc: 18432 },
        { name: "typescript", file_count: 78, loc: 9210 },
      ],
      module_count: 23,
      file_count: 220,
      edge_count: 481,
    },
    health_score: 82,
    summary: { violations: 7, cycles: 2, gravity_wells: 1, red_flags: 3 },
    layers: [
      { name: "ui",     file_count: 24, instability: 1.00, violations: 1 },
      { name: "domain", file_count: 67, instability: 0.37, violations: 0 },
      { name: "infra",  file_count: 18, instability: 0.09, violations: 6 },
    ],
    nodes: [
      // ui tier (top)
      { id: "ui/CheckoutForm", layer: "ui",     file_count: 4,  label: "CheckoutForm", x: 200, y: 70 },
      { id: "ui/CartView",     layer: "ui",     file_count: 3,  label: "CartView",     x: 480, y: 70 },
      // domain tier (middle)
      { id: "domain/payment",  layer: "domain", file_count: 12, label: "payment",      x: 140, y: 240, big: true },
      { id: "domain/cart",     layer: "domain", file_count: 8,  label: "cart",         x: 380, y: 240 },
      { id: "domain/user",     layer: "domain", file_count: 6,  label: "user",         x: 600, y: 240 },
      // infra tier (bottom)
      { id: "infra/db",        layer: "infra",  file_count: 5,  label: "db",           x: 180, y: 410, hotspot: true },
      { id: "infra/stripe",    layer: "infra",  file_count: 3,  label: "stripe",       x: 400, y: 410 },
      { id: "infra/email",     layer: "infra",  file_count: 4,  label: "email",        x: 600, y: 410 },
    ],
    edges: [
      { from: "ui/CheckoutForm", to: "domain/payment", weight: 4 },
      { from: "ui/CheckoutForm", to: "domain/cart",    weight: 2 },
      { from: "ui/CartView",     to: "domain/cart",    weight: 3 },
      { from: "domain/payment",  to: "infra/db",       weight: 2 },
      { from: "domain/payment",  to: "infra/stripe",   weight: 5 },
      { from: "domain/cart",     to: "infra/db",       weight: 1 },
      { from: "domain/user",     to: "infra/db",       weight: 3 },
      // ui → infra is a layer violation (ui directly reaches infra)
      { from: "ui/CheckoutForm", to: "infra/db",       weight: 1, violation: true,
        message: "Layer 'ui' may not depend on 'infra'." },
      // infra → domain creates a cycle (infra/email → domain/user, while domain/user → infra/db)
      { from: "infra/email",     to: "domain/user",    weight: 1, cycle: true },
    ],
  };

  const layerColor = name => `var(--accent-${name})`;

  // === LSM canvas renderer (shared across variants) ===
  function renderCanvas(containerEl) {
    const W = 760, H = 500;
    const layers = data.layers;
    const tierH = H / layers.length;

    let svg = `<svg class="lsm-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
      </marker>
      <marker id="arrowCycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="${'var(--edge-cycle)'}"/>
      </marker>
    </defs>`;

    // Layer health bands
    layers.forEach((ly, i) => {
      const fill = ly.violations > 0 ? 'var(--layer-band-warm)' : 'var(--layer-band-clean)';
      svg += `<rect x="0" y="${i * tierH}" width="${W}" height="${tierH}" fill="${fill}"/>`;
      svg += `<text x="20" y="${i * tierH + 18}" fill="var(--text-muted)" font-size="10" letter-spacing="2" text-transform="uppercase" font-family="ui-monospace, monospace">${ly.name.toUpperCase()} · ${ly.file_count}f${ly.violations ? ' · ' + ly.violations + ' violations' : ' · clean'}</text>`;
    });

    // Edges
    const nodeById = Object.fromEntries(data.nodes.map(n => [n.id, n]));
    data.edges.forEach(e => {
      const a = nodeById[e.from], b = nodeById[e.to];
      const ax = a.x + nodeW(a) / 2, ay = a.y + nodeH(a);
      const bx = b.x + nodeW(b) / 2, by = b.y;
      // bezier curve so things curve elegantly
      const cy = (ay + by) / 2;
      const stroke = e.violation ? 'var(--edge-violation)' : (e.cycle ? 'var(--edge-cycle)' : 'var(--edge)');
      const dash = e.violation ? '6 4' : '0';
      const sw = 1 + Math.min(e.weight, 4) * 0.4;
      // If cycle, reverse direction
      const start = e.cycle ? { x: bx, y: by, end: { x: ax, y: ay }} : { x: ax, y: ay, end: { x: bx, y: by }};
      svg += `<path d="M ${start.x} ${start.y} C ${start.x} ${cy}, ${start.end.x} ${cy}, ${start.end.x} ${start.end.y}"
                 fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}"
                 marker-end="url(#${e.cycle ? 'arrowCycle' : 'arrow'})" style="color:${stroke}" opacity="0.85"/>`;
    });

    // Nodes (rendered as foreignObject would be cleanest, but plain rect+text avoids HTML-in-SVG complexity)
    data.nodes.forEach(n => {
      const w = nodeW(n), h = nodeH(n);
      const stripeColor = `var(--accent-${n.layer})`;
      // Card body
      svg += `<g transform="translate(${n.x},${n.y})">
        <rect class="node-rect" x="0" y="0" width="${w}" height="${h}" fill="var(--card)" stroke="var(--border)" rx="12" ry="12"/>
        <rect x="0" y="0" width="4" height="${h}" fill="${stripeColor}" rx="2" ry="2"/>
        <text x="14" y="22" fill="var(--text-muted)" font-size="9" letter-spacing="1.5" font-family="ui-monospace, monospace">${n.layer.toUpperCase()}</text>
        <text x="${w - 14}" y="22" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="ui-monospace, monospace">${n.file_count} files</text>
        <text x="14" y="46" fill="var(--text)" font-size="14" font-weight="600">${n.label}</text>
        <text x="14" y="64" fill="var(--text-muted)" font-size="11">${n.id}</text>
      </g>`;
    });

    svg += `</svg>`;
    containerEl.innerHTML = svg;
  }

  function nodeH(n) { return 78; }

  function themeIcon() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☼';

  // === Variant orchestration ===
  const variants = {
    D: { name: 'Canvas + tabbed panel (Structure101 features)', render: VariantD, canvasId: 'canvasD' },
    A: { name: 'Canvas-first minimal',     render: VariantA, canvasId: 'canvasA' },
    B: { name: 'Three-pane workspace',     render: VariantB, canvasId: 'canvasB' },
    C: { name: 'Sidebar tree navigation',  render: VariantC, canvasId: 'canvasC' },
  };
  const order = ['D', 'A', 'B', 'C'];

  function currentVariant() {
    const params = new URLSearchParams(location.search);
    const v = (params.get('variant') || 'D').toUpperCase();
    return order.includes(v) ? v : 'D';
  }

  function renderRoot() {
    const v = currentVariant();
    const cfg = variants[v];
    document.getElementById('root').innerHTML = cfg.render();
    document.getElementById('switcherLabel').innerHTML = `${v} <small>— ${cfg.name}</small>`;

    // wire theme toggle
    const t = document.getElementById('themeToggle');
    if (t) t.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
      renderRoot();
    });

    // render canvas for this variant
    const c = document.getElementById(cfg.canvasId);
    if (c) renderCanvas(c);

    // wire node "click" to show details panel (variant A only — overlay UX)
    if (v === 'A') {
      const svg = document.querySelector('#canvasA svg');
      if (svg) svg.addEventListener('click', () => document.getElementById('detailsA').classList.add('open'));
    }
  }

  function cycle(delta) {
    const idx = order.indexOf(currentVariant());
    const next = order[(idx + delta + order.length) % order.length];
    const url = new URL(location.href);
    url.searchParams.set('variant', next);
    history.replaceState(null, '', url);
    renderRoot();
  }

  document.getElementById('prevBtn').addEventListener('click', () => cycle(-1));
  document.getElementById('nextBtn').addEventListener('click', () => cycle(1));
  document.addEventListener('keydown', e => {
    if (document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft') cycle(-1);
    if (e.key === 'ArrowRight') cycle(1);
  });

  renderRoot();
</script>
