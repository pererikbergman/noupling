name: Update Homebrew

# Triggers:
#   release: published    — manual release via the GitHub UI.
#   repository_dispatch   — fired by release.yml after the binary build job.
#                          GITHUB_TOKEN-created release events don't chain by
#                          design; repository_dispatch is the documented escape
#                          hatch and needs no extra secret.
#   workflow_dispatch     — run by hand to exercise HOMEBREW_TAP_TOKEN without
#                          cutting a release (#422). Defaults to the latest tag;
#                          on an already-current formula it ends green with
#                          "nothing to commit".
on:
  release:
    types: [published]
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to point the formula at (default: latest)"
        required: false
        default: ""

jobs:
  update-formula:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved: tag=${TAG} version=${VERSION}"

      - name: Calculate SHA256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.resolve.outputs.tag }}.tar.gz" | sha256sum | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

      - name: Update tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/pererikbergman/homebrew-noupling.git tap
          cd tap

          VERSION="${{ steps.resolve.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          TAG="${{ steps.resolve.outputs.tag }}"
          URL="https://github.com/pererikbergman/noupling/archive/refs/tags/${TAG}.tar.gz"

          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/noupling.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/noupling.rb

          echo "Updated formula:"
          cat Formula/noupling.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/noupling.rb
          # Idempotent: a re-run against a formula that already carries this
          # version has nothing to commit and must not fail the job (#422).
          if git diff --cached --quiet; then
            echo "Formula already at ${VERSION}; nothing to push."
          else
            git commit -m "Update noupling to ${VERSION}"
            git push
          fi
